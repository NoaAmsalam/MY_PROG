<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>המרת יחידות מידה</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 400px;
            margin: auto;
        }
        label, input, select, button {
            display: block;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>המרת יחידות מידה</h1>
        <label for="value">הכנס ערך להמרה:</label>
        <input type="number" id="value" placeholder="ערך" />

        <label for="unitFrom">בחר יחידת מידה מקורית:</label>
        <select id="unitFrom">
            <option value="cm">סנטימטרים</option>
            <option value="km">קילומטרים</option>
        </select>

        <label for="unitTo">בחר יחידת מידה יעד:</label>
        <select id="unitTo">
            <option value="m">מטרים</option>
            <option value="miles">מיילים</option>
        </select>

        <button onclick="convert()">המר</button>

        <h2>תוצאה:</h2>
        <p id="result">הצג תוצאה כאן</p>
    </div>

    <script>
        function convert() {
            var value = parseFloat(document.getElementById('value').value);
            var unitFrom = document.getElementById('unitFrom').value;
            var unitTo = document.getElementById('unitTo').value;
            var result = '';

            if (unitFrom === 'cm' && unitTo === 'm') {
                result = value / 100;
            } else if (unitFrom === 'km' && unitTo === 'miles') {
                result = value * 0.621371;
            } else {
                result = 'המרה לא נתמכת';
            }

            document.getElementById('result').textContent = result;
        }
    </script>
</body>
</html>
